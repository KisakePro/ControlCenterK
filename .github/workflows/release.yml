# Publie une Release GitHub à chaque tag de version (ex. v1.1.0) :
# compile l'application et l'installateur, calcule l'empreinte SHA-256, joint les notes du CHANGELOG.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à src/Version.cs
        shell: pwsh
        run: |
          $v = (Select-String -Path src/Version.cs -Pattern 'Current = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Le tag ${{ github.ref_name }} ne correspond pas à Version.cs ($v)" }

      - name: Compiler l'application et l'installateur
        shell: cmd
        run: build.cmd

      - name: Empreinte SHA-256 (vérifiée par la mise à jour intégrée)
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/MidiSoundController-Setup.exe -Algorithm SHA256).Hash
          "$h  MidiSoundController-Setup.exe" | Out-File -Encoding ascii dist/MidiSoundController-Setup.exe.sha256

      - name: Extraire les notes de version du CHANGELOG
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = @(); $in = $false
          foreach ($l in $lines) {
            if ($l -match '^## \[') { if ($in) { break }; if ($l -match "^## \[$([regex]::Escape($v))\]") { $in = $true; continue } }
            if ($in) { $out += $l }
          }
          if ($out.Count -eq 0) { $out = @("Version $v") }
          $out | Out-File -Encoding utf8 notes.md

      - name: Publier la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/MidiSoundController-Setup.exe dist/MidiSoundController-Setup.exe.sha256 `
            --title "MIDI Sound Controller ${{ github.ref_name }}" --notes-file notes.md
